# Lakeflow Spark Declarative Pipeline: landing volume -> bronze -> silver -> gold, plus docs_chunks.
# Serverless, triggered (runs when you start it, then stops). Table code lives in
# pipelines/transformations/ and follows the spec in pipelines/README.md.
resources:
  pipelines:
    payments_ops_pipeline:
      name: payments-ops-pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      root_path: ../pipelines
      libraries:
        - glob:
            include: ../pipelines/transformations/**
      configuration:
        # Read in code with spark.conf.get("landing_path")
        landing_path: /Volumes/${var.catalog}/${var.schema}/landing
